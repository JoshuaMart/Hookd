name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    name: Test Go Server
    runs-on: ubuntu-latest

    # The storage contract suite also runs against a real server.
    services:
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Run tests with coverage
        working-directory: ./server
        env:
          HOOKD_TEST_REDIS_ADDR: localhost:6379
        run: |
          go test -v -coverprofile=cover.out ./...

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: server/cover.out
          strip-prefix: github.com/jomar/hookd/
          add-prefix: server/

  test-go-client:
    name: Test Go Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Run tests
        working-directory: ./clients/go
        run: |
          go test -v ./...

  test-ruby:
    name: Test Ruby Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.2"
          working-directory: ./clients/ruby

      - name: Install dependencies
        working-directory: ./clients/ruby
        run: |
          gem install bundler
          bundle install

      - name: Run tests with coverage
        working-directory: ./clients/ruby
        run: |
          bundle exec rspec --format documentation

      - name: Upload coverage to Qlty
        if: always()
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: clients/ruby/coverage/.resultset.json
