# Hookd Configuration Example

server:
  # Domain for the service (required)
  # All hooks will be subdomains of this domain
  domain: "hookd.domain.tld"

  # Public IP returned in DNS A answers (the address clients dial back).
  # Leave empty to auto-detect the outbound interface IP. Set it explicitly
  # when the auto-detected value is wrong — e.g. behind NAT, on a multi-homed
  # host, or when the public IP differs from the local interface IP.
  public_ip: ""

  dns:
    # Enable DNS server
    enabled: true
    # DNS port (requires root or CAP_NET_BIND_SERVICE for port 53)
    port: 53
    # Local address the DNS listener binds to. Leave empty to bind all
    # interfaces. Set it to the server's public IP to coexist with a local stub
    # resolver (e.g. systemd-resolved on 127.0.0.53:53) without stopping it —
    # stopping it would break the host's own DNS resolution.
    bind_address: ""

  http:
    # HTTP port
    port: 80

  https:
    # Enable HTTPS
    enabled: true
    # HTTPS port
    port: 443
    # Enable Let's Encrypt automatic certificate management
    autocert: true
    # Directory to cache certificates
    cache_dir: "/var/lib/hookd/certs"
    # Recursive resolvers CertMagic uses to self-check DNS-01 challenge
    # propagation before validation. Leave empty for the public defaults
    # (Cloudflare + Google). Scoped to the ACME solver only — the process's own
    # name resolution stays on the system resolver.
    # resolvers:
    #   - "1.1.1.1:53"
    #   - "8.8.8.8:53"

  smtp:
    # Inbound SMTP capture, which turns a hook into a disposable mailbox at
    # <hookid>@hookd.domain.tld. Reception only: Hookd never sends, relays or
    # bounces. Disabled by default — it binds a privileged port and exposes a
    # public receiver, so it is opt-in.
    #
    # Nothing to add in DNS: the server already answers MX for every name under
    # the domain. Check that your host does not filter inbound port 25.
    enabled: false
    # SMTP port (requires root or CAP_NET_BIND_SERVICE for port 25)
    port: 25
    # Local address the SMTP listener binds to. Empty binds all interfaces.
    bind_address: ""
    # Largest message accepted, advertised through the SIZE extension so a
    # sender can give up before transferring the body. Above it: 552.
    max_message_bytes: 262144
    # Recipients accepted per message; past it, 452.
    max_recipients: 10
    # Concurrent sessions; past it, 421 and the connection is closed.
    max_concurrent: 50
    # Deadline for a single command or data line.
    read_timeout: "60s"
    # Deadline for a whole session, however busy it is.
    session_timeout: "5m"

  api:
    # Authentication token for API access
    # If empty, a random token will be generated at startup
    # Can be overridden with --token CLI flag
    auth_token: ""

    # Dedicated API listener. When enabled, the API (/register, /poll, /read,
    # /ack, /activity, /hooks) and /metrics are served only on this port and
    # removed from the public HTTP/HTTPS listeners, which keep capture and
    # /health(z) only: a request to /register there gets the same empty 200 as
    # any unknown path. Meant for a port reachable from a private network only
    # (internal load balancer, VPC, mesh). Disabled by default.
    listener:
      enabled: false
      # Local address to bind. Empty binds all interfaces; set the private IP
      # to keep the port off the public interface.
      bind_address: ""
      # Must differ from the HTTP, HTTPS, SMTP and DNS ports.
      port: 8443
      # "acme": reuse the wildcard certificate managed for server.domain
      #         (requires https.enabled and https.autocert; clients connect
      #         with SNI/Host = server.domain).
      # "file": use cert_file and key_file, e.g. from an internal CA or
      #         cert-manager. A rotated pair is picked up within a minute.
      # "none": plain HTTP, only behind a TLS-terminating proxy or mesh. The
      #         API's HTTPS requirement is not enforced in this mode.
      # With acme or file the port is HTTPS only, health checks included.
      tls: "acme"
      cert_file: ""
      key_file: ""

eviction:
  # TTL for interactions (interactions are deleted after this duration)
  # Supported formats: 30s, 5m, 1h, 24h, 48h
  interaction_ttl: "1h"

  # TTL for hooks (inactive hooks are deleted after this duration)
  # Supported formats: 30s, 5m, 1h, 24h, 48h
  hook_ttl: "24h"

  # Maximum number of interactions per hook
  # Older interactions are evicted first (FIFO): immediately on insertion
  # for in-memory hooks, during periodic cleanup for SQLite hooks.
  max_per_hook: 1000

  # Captured HTTP bodies are truncated to this many bytes (the interaction is
  # kept, flagged with "truncated": true). Lower it if max_memory_mb is small.
  max_interaction_body_bytes: 1048576

  # Maximum memory usage in MB
  # Emergency eviction occurs when approaching this limit
  max_memory_mb: 1800

  # Interval for cleanup of expired interactions
  cleanup_interval: "10s"

long_lived:
  # Durable, long-lived hooks are persisted to SQLite so they survive restarts.
  # A registration whose ttl exceeds eviction.hook_ttl is treated as long-lived;
  # omit ttl (or keep it <= hook_ttl) for ordinary ephemeral, in-memory hooks.
  # Ideal for stored-XSS style detection, where a payload may fire days later.
  enabled: true

  # Absolute cap on a long-lived hook's ttl (must be greater than hook_ttl).
  # Supported formats: 1h, 24h, 168h, 720h
  max_ttl: "720h"

  # Maximum number of long-lived hooks stored at once (bounds memory and disk).
  # Registrations past this limit are rejected with HTTP 429.
  max_hooks: 500

  # Persisted HTTP bodies are truncated to this many bytes (they can accumulate
  # for weeks, so full multi-megabyte bodies are not kept on disk).
  max_interaction_body_bytes: 65536

  # Maximum size of the metadata attached to a hook, in bytes.
  max_metadata_bytes: 8192

  # Path to the SQLite database file.
  db_path: "/var/lib/hookd/longlived.db"

observability:
  # Enable /metrics endpoint
  metrics_enabled: true

  # Require the server.api.auth_token in the X-API-Key header for /metrics.
  # Uses the same HTTPS requirement as the API when autocert is enabled.
  # false preserves public metrics access. /health and /healthz are always public.
  metrics_require_auth: false

  # Log level: debug, info, warn, error
  log_level: "info"

  # Log format: json, text
  log_format: "json"

storage:
  # Where hooks and interactions live.
  #   local: in this process (memory, plus SQLite for long-lived hooks).
  #   redis: in a Redis or Valkey server shared by every instance, so several
  #          instances can run behind a load balancer. Long-lived hooks, ACME
  #          challenge records and certificates are stored there too, so
  #          long_lived.db_path and server.https.cache_dir are unused.
  backend: "local"

  redis:
    # Redis 7.0+ or Valkey 7.2+. Cluster mode is not supported.
    # Run the server with maxmemory-policy noeviction: under the default
    # policies Redis could silently drop hooks to free memory.
    addr: "localhost:6379"
    username: ""
    password: ""          # or HOOKD_STORAGE_REDIS_PASSWORD
    tls: false
    # Every key starts with this prefix, so deployments can share a server.
    key_prefix: "hookd:"
    dial_timeout: "5s"
    read_timeout: "1s"
    write_timeout: "1s"
    # 0 keeps the client default (10 connections per CPU).
    pool_size: 0
    # Hook IDs remembered as existing, which spares most captures a round-trip
    # to Redis. Only existence is cached, never absence, so a new hook captures
    # at once everywhere; a stale entry only costs a write that Redis rejects.
    # 0 disables the cache.
    has_cache_size: 50000
    has_cache_ttl: "30s"
